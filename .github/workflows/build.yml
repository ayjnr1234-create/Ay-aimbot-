name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          # Your file is CODM-ESP-Aimbot-Mod-Menu... - find it even without .zip extension
          FILE=$(find . -maxdepth 1 -type f -name "CODM*" | head -n 1)
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          TARGET=${ZIP:-$FILE}
          
          echo "Using file: $TARGET"
          mkdir -p extracted
          unzip -o -q "$TARGET" -d extracted
          ls extracted

      - name: Find Android project
        run: |
          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW" ]; then
            GRADLEW=$(find . -type f -name "gradlew" | head -n 1)
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # REMOVED the broken Set up Android SDK step - not needed

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
